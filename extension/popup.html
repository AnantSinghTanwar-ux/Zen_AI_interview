<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZenAI Extension</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="zenai-popup-body">
    <main class="zenai-popup-card">
      <h1 class="zenai-popup-title">ZenAI</h1>
      <p class="zenai-popup-subtitle">Resume Fit Assistant</p>

      <div class="zenai-status-row">
        <span class="zenai-status-label">Login Status</span>
        <span id="statusBadge" class="zenai-status-badge">Checking...</span>
      </div>

      <div class="zenai-status-row">
        <span class="zenai-status-label">Extension</span>
        <label class="zenai-toggle" for="extensionEnabledToggle">
          <input id="extensionEnabledToggle" type="checkbox" />
          <span class="zenai-toggle-track" aria-hidden="true"></span>
          <span id="extensionEnabledText" class="zenai-toggle-text">On</span>
        </label>
      </div>

      <label class="zenai-input-label" for="authTokenInput">Auth Token</label>
      <input id="authTokenInput" class="zenai-input" type="password" placeholder="Paste your token" autocomplete="off" />

      <div class="zenai-btn-grid">
        <button id="saveTokenBtn" class="zenai-popup-btn primary" type="button">Save Token</button>
        <button id="clearTokenBtn" class="zenai-popup-btn subtle" type="button">Clear</button>
      </div>

      <button id="dashboardBtn" class="zenai-popup-btn full" type="button">Go to Dashboard</button>

      <p id="messageText" class="zenai-message" role="status" aria-live="polite"></p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
