version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zenai-web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
      - ollama

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: zenai-worker
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - redis
      - ollama

  redis:
    image: redis:7-alpine
    container_name: zenai-redis
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis-data:/data

  ollama:
    image: ollama/ollama:latest
    container_name: zenai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    command: ["serve"]

volumes:
  redis-data:
  ollama-data:
