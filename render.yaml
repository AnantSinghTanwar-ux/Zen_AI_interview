services:
  - type: web
    name: zenai-web
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: local
      - key: AI_PROVIDER_FALLBACK
        value: gemini
      - key: LOCAL_MODEL_NAME
        value: mistral:7b
      - key: CACHE_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: zenai-redis
          property: connectionString

  - type: worker
    name: zenai-feedback-worker
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run worker
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: local
      - key: AI_PROVIDER_FALLBACK
        value: gemini
      - key: LOCAL_MODEL_NAME
        value: mistral:7b
      - key: CACHE_ENABLED
        value: "true"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: redis
          name: zenai-redis
          property: connectionString

  - type: redis
    name: zenai-redis
    plan: starter
    ipAllowList: []
